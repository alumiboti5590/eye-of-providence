import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // The official repository for all WPILib and FRC-related artifacts
    maven {
        url = "https://frcmaven.wpi.edu/artifactory/release/"
    }
}

// Ensure these match your team's naming conventions
group = 'com.team5590.eyeofprovidence' 
version = '0.1.0'

dependencies {
    // 1. Core WPILib (SubsystemBase, Component classes, Hardware wrappers)
    implementation 'edu.wpi.first.wpilibj:wpilibj-java:2026.+'
    
    // 2. Command-Based Framework (Command, SequentialCommandGroup, Trigger, etc.)
    implementation 'edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:2026.+'
    
    // 3. Core Math and Utilities (Geometry, Kinematics, Units, NetworkTables)
    implementation 'edu.wpi.first.wpimath:wpimath-java:2026.+'
    implementation 'edu.wpi.first.wpiutil:wpiutil-java:2026.+'
    implementation 'edu.wpi.first.ntcore:ntcore-java:2026.+'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            // This builds a structured maven folder locally inside build/repo
            url = layout.buildDirectory.dir("repo")
        }
    }
}

tasks.withType(Test) {
    testLogging {
        // set options for log level LIFECYCLE
        events TestLogEvent.FAILED,
               TestLogEvent.PASSED,
               TestLogEvent.SKIPPED,
               TestLogEvent.STANDARD_OUT
        exceptionFormat TestExceptionFormat.FULL
        showExceptions true
        showCauses true
        showStackTraces true

        // set options for log level DEBUG and INFO
        debug {
            events TestLogEvent.STARTED,
                   TestLogEvent.FAILED,
                   TestLogEvent.PASSED,
                   TestLogEvent.SKIPPED,
                   TestLogEvent.STANDARD_ERROR,
                   TestLogEvent.STANDARD_OUT
            exceptionFormat TestExceptionFormat.FULL
        }
        info.events = debug.events
        info.exceptionFormat = debug.exceptionFormat

        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
            }
        }
    }
}

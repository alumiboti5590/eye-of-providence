import groovy.json.JsonSlurper
import org.gradle.internal.os.OperatingSystem

buildscript {
   ext.WPI_VER = "2026.2.1"
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

// Create a custom configuration bucket to hold the native zip archives
configurations {
    nativeLibs
}

// Dynamically determine the host operating system classifier
def osClassifier = "linuxx86-64" // Default fallback for GitHub Actions
if (OperatingSystem.current().isWindows()) {
    osClassifier = "windowsx86-64"
} else if (OperatingSystem.current().isMacOsX()) {
    osClassifier = "osxuniversal"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Ensure these match your team's naming conventions
group = 'com.alumiboti5590' 
version = '0.1.1'

// =========================================================================
// 🔄 AUTOMATIC VENDORDEP PARSER
// =========================================================================
// This script parses standard FRC JSON files exactly like GradleRIO does.
def vendorRepos = []
def vendorDeps = []
def vendorNativeDeps = [] 
def vendordepsDir = file('vendordeps')

if (vendordepsDir.exists()) {
    vendordepsDir.eachFileMatch(~/.*\.json/) { jsonFile ->
        def parsedJson = new JsonSlurper().parse(jsonFile)
        if (parsedJson.mavenUrls) {
            vendorRepos.addAll(parsedJson.mavenUrls)
        }
        if (parsedJson.javaDependencies) {
            parsedJson.javaDependencies.each { dep ->
                vendorDeps.add("${dep.groupId}:${dep.artifactId}:${dep.version}")
            }
        }
        if (parsedJson.jniDependencies) {
            parsedJson.jniDependencies.each { dep ->
                // Only collect if it explicitly supports our desktop OS
                if (dep.validPlatforms && dep.validPlatforms.contains(osClassifier)) {
                    vendorNativeDeps.add([
                        groupId   : dep.groupId,
                        artifactId: dep.artifactId,
                        version   : dep.version,
                        isJar     : dep.isJar ?: false
                    ])
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    // The official repository for all WPILib and FRC-related artifacts
    maven {
        url = "https://frcmaven.wpi.edu/artifactory/release/"
    }
    
    // Dynamically inject the repository URLs found inside your vendordeps JSONs
    vendorRepos.unique().each { repoUrl ->
        maven { url = repoUrl }
    }
}

dependencies {
    // =========================================================================
    // 1. Core WPILib & FRC Framework Libraries
    // =========================================================================
    implementation "edu.wpi.first.wpilibj:wpilibj-java:${WPI_VER}"
    implementation "edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:${WPI_VER}"
    implementation "edu.wpi.first.wpimath:wpimath-java:${WPI_VER}"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:${WPI_VER}"
    implementation "edu.wpi.first.wpiutil:wpiutil-java:${WPI_VER}"
    implementation "edu.wpi.first.apriltag:apriltag-java:${WPI_VER}"
    implementation "edu.wpi.first.ntcore:ntcore-java:${WPI_VER}"
    implementation "edu.wpi.first.hal:hal-java:${WPI_VER}"

    // Tells Gradle to pull the C++ zip matching your specific computer platform
    nativeLibs "edu.wpi.first.ntcore:ntcore-cpp:${WPI_VER}:${osClassifier}@zip"
    nativeLibs "edu.wpi.first.hal:hal-cpp:${WPI_VER}:${osClassifier}@zip"
    nativeLibs "edu.wpi.first.wpiutil:wpiutil-cpp:${WPI_VER}:${osClassifier}@zip"
    nativeLibs "edu.wpi.first.wpimath:wpimath-cpp:${WPI_VER}:${osClassifier}@zip"
    nativeLibs "edu.wpi.first.wpinet:wpinet-cpp:${WPI_VER}:${osClassifier}@zip"

    // =========================================================================
    // 2. Data Processing & Utilities (Jackson JSON Engine)
    // =========================================================================
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // =========================================================================
    // 3. Unit Testing Architecture (JUnit 5)
    // =========================================================================
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Core Mockito framework (includes mockStatic capabilities natively in 5.x)
    testImplementation 'org.mockito:mockito-core:5.11.0'
    // Integrates Mockito seamlessly with the JUnit 5 lifecycle
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    // =========================================================================
    // 4. Test Runtime Support Dependencies
    // =========================================================================
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'us.hebi.quickbuf:quickbuf-runtime:1.4'
    testImplementation 'org.ejml:ejml-simple:0.44.0'

    // =========================================================================
    // 5. Third-Party Vendor Libraries (Dynamically Loaded)
    // =========================================================================
    // This loops through and pulls every Java dependency specified in your JSONs
    vendorDeps.each { depCoordinates ->
        implementation depCoordinates
    }

    vendorNativeDeps.unique().each { dep ->
        if (dep.isJar) {
            // 📦 Group A: Native binaries packaged inside a standard Java .jar archive
            // Evaluates when 'isJar: true' is explicitly specified in the JSON file.
            nativeLibs "${dep.groupId}:${dep.artifactId}:${dep.version}:${osClassifier}"
        } else {
            // 🗜️ Group B: Native binaries packaged inside a standard C++ .zip archive
            // Evaluates when 'isJar: false' or when the property is missing entirely.
            nativeLibs "${dep.groupId}:${dep.artifactId}:${dep.version}:${osClassifier}@zip"
        }
    }
}

// =========================================================================
// 🚀 Publishing Configuration
// =========================================================================
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'eyeofprovidence'
            version = project.version
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir("repo")
        }
    }
}

// =========================================================================
// 🧪 Test Suite Reporting Configuration
// =========================================================================
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

// Automatically unpacks the .dylib, .dll, or .so files into a local build folder
tasks.register('extractNativeLibs', Copy) {
    from configurations.nativeLibs.collect { zipTree(it) }
    include "**/*.dll", "**/*.dylib", "**/*.so"
    eachFile { path = name } // 💡 Crucial: Flattens the folders so files land in the root
    includeEmptyDirs = false
    into layout.buildDirectory.dir("nativeLibs")
}

tasks.withType(Test) {
    useJUnitPlatform()

    // Force the test task to wait until the native extraction finishes
    dependsOn tasks.named('extractNativeLibs')
    
    // Inject the extraction directory directly into the JVM library path
    systemProperty "java.library.path", layout.buildDirectory.dir("nativeLibs").get().asFile.absolutePath

    testLogging {
        events TestLogEvent.FAILED, TestLogEvent.PASSED, TestLogEvent.SKIPPED, TestLogEvent.STANDARD_OUT
        exceptionFormat TestExceptionFormat.FULL
        showExceptions true
        showCauses true
        showStackTraces true

        debug {
            events TestLogEvent.STARTED, TestLogEvent.FAILED, TestLogEvent.PASSED, TestLogEvent.SKIPPED, TestLogEvent.STANDARD_ERROR, TestLogEvent.STANDARD_OUT
            exceptionFormat TestExceptionFormat.FULL
        }
        info.events = debug.events
        info.exceptionFormat = debug.exceptionFormat

        afterSuite { desc, result ->
            if (!desc.parent) {
                def ANSI_RESET = "\u001B[0m"
                def ANSI_GREEN = "\u001B[32m"
                def ANSI_RED   = "\u001B[31m"
                def isSuccess = result.resultType.toString() == "SUCCESS"
                def bannerColor = isSuccess ? ANSI_GREEN : ANSI_RED
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                println('\n' + ('-' * repeatLength) + '\n' + startItem + bannerColor + output + ANSI_RESET + endItem + '\n' + ('-' * repeatLength))
            }
        }
    }
}